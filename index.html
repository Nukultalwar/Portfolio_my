    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Nukul Talwar",
        "jobTitle": "Software Engineer & Frontend Developer",
        "url": "https://nukultalwar.dev",
        "sameAs": [
          "https://github.com/Nukultalwar",
          "https://www.linkedin.com/in/nukul-talwar-84a574211/"
        ],
        "knowsAbout": [
          "JavaScript",

  </head>
  <body class="bg-[#07090e] text-slate-100 font-sans antialiased selection:bg-cyan-500/20 selection:text-cyan-300 overflow-x-hidden min-h-screen">
    <div id="root"></div>

    <!-- Vite Development Entrypoint (used when running 'npm run dev') -->
    <script type="module" src="/src/main.tsx"></script>

    <!-- Seamless Static Fallback (for Live Server, GitHub Pages, or direct file viewing when Vite is not running) -->
    <script type="module">
      setTimeout(() => {
        const root = document.getElementById('root');
        if (root && (!root.children || root.children.length === 0)) {
          // Inject production stylesheet if not loaded
          if (!document.querySelector('link[href*=".css"]')) {
            const link = document.createElement('link');
            link.rel = 'stylesheet';
            link.href = './assets/app.css';
            document.head.appendChild(link);
          }
          // Dynamically import the compiled production bundle
          const loadModule = new Function('u', 'return import(u)');
          loadModule('./assets/app.js').catch((err) => {
            console.error('Static fallback bundle failed to load:', err);
          });
        }
      }, 200);
    </script>
  </body>
</html>
